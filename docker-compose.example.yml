# Example deployment. Copy to docker-compose.yml, change the music path, then: docker compose up -d
services:
  axdio:
    image: ghcr.io/xo907/axdio:latest   # or `build: .` to build from this folder
    container_name: axdio
    restart: unless-stopped
    ports:
      - "7865:7865"
    volumes:
      - /path/to/your/music:/music     # your library
      - ./config:/app/config           # settings, accounts, caches and backups
      # Optional: keep private messages and their encrypted photos/videos somewhere else (another disk, an encrypted volume)
      # - /path/to/private/chat:/chat
      # Optional: lets the admin panel install new versions of Axdio (it gives Axdio control over Docker on this machine)
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - PUID=1000                      # owner of ./config (id -u)
      - PGID=1000
      # - CHAT_DIR=/chat                # where private messages are stored (default: /app/config/chat)
      # Optional: the Downloader plugin (1.13+) reaches YouTube through this proxy. YouTube asks most servers in data
      # centres to "confirm you're not a bot"; through the warp service below it doesn't. Only YouTube's traffic uses it.
      # - AXDIO_YOUTUBE_PROXY=http://warp:1080

  # Optional: Cloudflare WARP, a free way out to the internet from somewhere other than this server's address, for
  # services that block servers (see AXDIO_YOUTUBE_PROXY above). It's reachable only by Axdio: no ports are published.
  # warp:
