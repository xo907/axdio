<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self'">
<title>Axdio</title>
<link rel="stylesheet" href="page.css">
</head>
<body>
<div class="drag"></div>
<div class="bg"><i></i><i></i><i></i></div>
<main class="card">
  <div class="off"><svg viewBox="0 0 24 24"><path d="M23.64 7c-.45-.34-4.93-4-11.64-4-1.5 0-2.89.19-4.15.48L18.18 13.8 23.64 7zM17.04 15.22 3.27 1.44 2 2.72l2.05 2.06C1.91 5.76.59 6.82.36 7l11.63 14.49.01.01.01-.01 3.9-4.86 3.32 3.32 1.27-1.27-3.46-3.46z"/></svg></div>
  <h1>Can't reach your server</h1>
  <p>Axdio will try again by itself. Check that you're online, and that the server is running.</p>
  <span class="server" id="server"></span>
  <div class="row">
    <button class="solid" id="retry">Try again</button>
    <button class="ghost" id="change">Change server</button>
  </div>
  <p class="err" id="err" style="margin-top:14px"></p>
</main>
<script>
  const $ = id => document.getElementById(id);
  const q = new URLSearchParams(location.search);
  $('server').textContent = q.get('server') || '';
  if (q.get('error')) $('err').textContent = q.get('error').replace(/^net::/, '');
  const retry = () => { $('retry').disabled = true; $('retry').textContent = 'Trying…'; window.axdioDesktop.retry(); };
  $('retry').addEventListener('click', retry);
  $('change').addEventListener('click', () => { location.href = 'setup.html?server=' + encodeURIComponent(q.get('server') || ''); });
  // Back by itself when the connection is.
  let wait = 10;
  setInterval(() => { if (navigator.onLine && --wait <= 0) { wait = 15; retry(); } }, 1000);
  window.addEventListener('online', retry);
</script>
</body>
</html>
